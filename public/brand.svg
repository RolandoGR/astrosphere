      <g transform="translate(7.3 0) skewX(-12)" fill="none" stroke-width="8" stroke-linecap="round">
        <path d="M12 41V20" stroke="currentColor"/>
        <path d="M12 28c0-6 4-9 10-9" stroke="currentColor"/>
        <circle cx="39" cy="28" r="9.5" stroke="var(--brand-accent, #0f8f83)"/>
        <path d="M48.5 25v15c0 6.5-4 10-10.5 10" stroke="var(--brand-accent, #0f8f83)"/>
      </g>
    </symbol>
  </defs>
</svg>
